name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Install Android SDK 34
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 || true
        
    - name: Fix gradlew permissions
      run: chmod +x gradlew
      
    - name: Build Release APK
      id: build
      shell: bash
      run: |
        echo "=== Release Build Start ==="
        set -o pipefail
        ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-output.log
        echo "=== Release Build End ==="
        find app/build -name "*.apk" 2>/dev/null
        
    - name: Show full build log on failure
      if: failure()
      run: |
        echo "=== FULL BUILD LOG ==="
        cat gradle-output.log
        echo "=== END BUILD LOG ==="
        
    - name: Check Release APK output
      if: success()
      run: |
        echo "=== Release APK Files ==="
        find app/build -name "*.apk" 2>/dev/null
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release output dir"
        
    - name: Upload Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: DShare-release APK
        path: app/build/outputs/apk/release/app-release.apk

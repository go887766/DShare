name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Install Android SDK 34
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 || true
        echo "=== SDK Platforms ==="
        ls $ANDROID_HOME/platforms/ || echo "No platforms dir"
        
    - name: Fix gradlew permissions
      run: chmod +x gradlew
      
    - name: Build Debug APK
      id: build
      run: |
        echo "=== Gradle Build Start ==="
        ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-output.log
        echo "=== Gradle Build End ==="
        # Check if APK was produced
        find app/build -name "*.apk" 2>/dev/null
        
    - name: Show full build log on failure
      if: failure()
      run: |
        echo "=== FULL BUILD LOG ==="
        cat gradle-output.log
        echo "=== END BUILD LOG ==="
        
    - name: Check APK output
      if: success()
      run: |
        echo "=== APK Files ==="
        find app/build -name "*.apk" 2>/dev/null
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug output dir"
        
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: DShare-debug APK
        path: app/build/outputs/apk/debug/app-debug.apk
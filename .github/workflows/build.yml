name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties
        
    - name: Check Gradle files
      run: |
        ls -la gradle/wrapper/
        cat gradle/wrapper/gradle-wrapper.properties
        
    - name: Download Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar
        cat gradle/wrapper/gradle-wrapper.properties
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100
      
    - name: Check build output
      if: success()
      run: |
        ls -la app/build/outputs/apk/debug/
        
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: DShare-debug APK
        path: app/build/outputs/apk/debug/app-debug.apk
